name: Build libultrahdr with Bundled Deps (patched libheif + libjpeg-turbo)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout libultrahdr
        uses: actions/checkout@v4

      # libjpeg-turbo SIMD 需要 NASM
      - name: Setup NASM
        uses: ilammy/setup-nasm@v1

      - name: Verify NASM
        shell: pwsh
        run: |
          nasm -v
          "NASM=$((Get-Command nasm).Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Split-Path -Parent (Get-Command nasm).Source) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # 加载 MSVC x64 环境（vcvars）
      - name: Setup MSVC 2022/2026 x64 environment
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Load vcvars64
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            Write-Error "Cannot find VC tools"
            exit 1
          }
          Write-Host "Found VS at: $vsPath"
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c """$vcvars"" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $key = $matches[1]
              $val = $matches[2]
              echo "$key=$val" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      # 重点：Generator 改成 Ninja，不再依赖 VS 解决方案生成器
      - name: CMake Configure (Bundled Deps, Ninja)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          cmake -S . -B build -G Ninja `
            -DUHDR_BUILD_DEPS=ON `
            -DUHDR_ENABLE_HEIF=ON `
            -DUHDR_BUILD_TESTS=OFF `
            -DUHDR_BUILD_EXAMPLES=OFF `
            -DBUILD_SHARED_LIBS=OFF

      - name: CMake Build
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: cmake --build build --verbose

      - name: Collect artifacts
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path build -Recurse -Include *.lib,*.dll,*.exe -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName -Destination dist\ }
          Write-Host "Collected files:"
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libultrahdr-bundled-deps-win-x64
          path: dist/
          if-no-files-found: error
