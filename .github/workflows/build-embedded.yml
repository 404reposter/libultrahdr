name: Build libultrahdr v2.02 Release with Bundled Deps

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout libultrahdr v2.02
        uses: actions/checkout@v4
        with:
          ref: v2.02

      - name: Setup NASM
        uses: ilammy/setup-nasm@v1

      - name: Verify NASM
        shell: pwsh
        run: |
          nasm -v
          "NASM=$((Get-Command nasm).Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Split-Path -Parent (Get-Command nasm).Source) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Setup MSVC x64 environment
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Load vcvars64
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            Write-Error "Cannot find VC tools"
            exit 1
          }
          Write-Host "Found VS at: $vsPath"
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c """$vcvars"" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $key = $matches[1]
              $val = $matches[2]
              echo "$key=$val" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: CMake Configure (Bundled Deps, Ninja, Release)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DUHDR_BUILD_DEPS=ON `
            -DUHDR_ENABLE_HEIF=ON `
            -DUHDR_BUILD_TESTS=OFF `
            -DUHDR_BUILD_EXAMPLES=OFF `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_CXX_FLAGS="/O2 /DNDEBUG"

      - name: CMake Build
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: cmake --build build --verbose

      - name: Verify Release
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $libs = Get-ChildItem -Path build -Recurse -Filter "*.lib"
          foreach ($lib in $libs) {
            $bytes = [System.IO.File]::ReadAllBytes($lib.FullName)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($text -match "libcpmtd" -or $text -match "_malloc_dbg") {
              Write-Error "${lib.Name} contains Debug markers"
              exit 1
            }
          }
          Write-Host "All .lib verified as Release"

      - name: Collect artifacts
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path build -Recurse -Include *.lib,*.dll,*.exe -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName -Destination dist\ }
          Write-Host "Collected files:"
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libultrahdr-v2.02-release-bundled-deps-win-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
