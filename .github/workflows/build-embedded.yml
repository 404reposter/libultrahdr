name: Build libultrahdr Embedded (jpeg-turbo + patched libheif built-in, WITH NASM SIMD)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-embedded:
    runs-on: windows-latest
    steps:
      - name: Checkout libultrahdr
        uses: actions/checkout@v4

      - name: Setup NASM
        uses: ilammy/setup-nasm@v1

      - name: Setup MSVC 2022 x64
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: CMake Configure
        shell: pwsh
        run: |
          cmake -G "Visual Studio 17 2022" -B build `
            -DUHDR_BUILD_DEPS=ON `
            -DUHDR_ENABLE_HEIF=ON `
            -DUHDR_BUILD_TESTS=OFF `
            -DBUILD_SHARED_LIBS=ON `
            ..

      - name: CMake Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Collect artifact
        shell: pwsh
        run: |
          mkdir dist
          copy build\Release\libuhdr.dll dist\

      - name: Upload libuhdr.dll
        uses: actions/upload-artifact@v4
        with:
          name: libultrahdr-embedded-win-x64-release
          path: dist/
