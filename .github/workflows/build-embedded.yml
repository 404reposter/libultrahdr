name: Build libultrahdr Embedded (jpeg-turbo + patched libheif built-in)
on:
  push:
  pull_request:
  workflow_dispatch:  # 可以手动点按钮触发编译

jobs:
  build-embedded:
    runs-on: windows-latest
    steps:
      - name: Checkout libultrahdr
        uses: actions/checkout@v4

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: CMake Configure & Build Embedded Version
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" ^
            -DUHDR_BUILD_DEPS=ON ^
            -DUHDR_ENABLE_HEIF=ON ^
            -DUHDR_BUILD_TESTS=OFF ^
            -DBUILD_SHARED_LIBS=ON ^
            ..
          cmake --build . --config Release
        shell: pwsh

      - name: Collect artifact
        run: |
          mkdir dist
          copy build\Release\libuhdr.dll dist\
        shell: pwsh

      - name: Upload libuhdr.dll
        uses: actions/upload-artifact@v4
        with:
          name: libultrahdr-embedded-win-x64-release
          path: dist/
